<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 34" width="1000" height="130" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="262" height="34" fill="#ffffff"/>
<rect x="2" y="2" width="30" height="22" rx="1.2" fill="#f7f5f0" stroke="#333333" stroke-width="0.3"/><text x="4" y="7" font-size="3.4" font-weight="bold" fill="#333333">Tile</text><text x="4" y="12" font-size="2.9" fill="#333333" >MLT, decoded</text><text x="4" y="16.2" font-size="2.9" fill="#333333" >to typed arrays</text><line x1="32.6" y1="13" x2="37.4" y2="13" stroke="#333333" stroke-width="0.4"/><polygon points="39.4,13 37.4,13.9 37.4,12.1" fill="#333333" stroke-width="0.4"/><rect x="40" y="2" width="30" height="22" rx="1.2" fill="#f7f5f0" stroke="#333333" stroke-width="0.3"/><text x="42" y="7" font-size="3.4" font-weight="bold" fill="#333333">Stitch</text><text x="42" y="12" font-size="2.9" fill="#333333" >with neighbours,</text><text x="42" y="16.2" font-size="2.9" fill="#333333" >cut to a margin</text><line x1="70.6" y1="13" x2="75.4" y2="13" stroke="#333333" stroke-width="0.4"/><polygon points="77.4,13 75.4,13.9 75.4,12.1" fill="#333333" stroke-width="0.4"/><rect x="78" y="2" width="30" height="22" rx="1.2" fill="#f7f5f0" stroke="#333333" stroke-width="0.3"/><text x="80" y="7" font-size="3.4" font-weight="bold" fill="#333333">Nodes</text><text x="80" y="12" font-size="2.9" fill="#333333" >shared line ends</text><line x1="108.6" y1="13" x2="113.4" y2="13" stroke="#333333" stroke-width="0.4"/><polygon points="115.4,13 113.4,13.9 113.4,12.1" fill="#333333" stroke-width="0.4"/><rect x="116" y="2" width="30" height="22" rx="1.2" fill="#f7f5f0" stroke="#333333" stroke-width="0.3"/><text x="118" y="7" font-size="3.4" font-weight="bold" fill="#333333">Style table</text><text x="118" y="12" font-size="2.9" fill="#333333" >group, rank, width,</text><text x="118" y="16.2" font-size="2.9" fill="#333333" >colours per line</text><line x1="146.6" y1="13" x2="151.4" y2="13" stroke="#333333" stroke-width="0.4"/><polygon points="153.4,13 151.4,13.9 151.4,12.1" fill="#333333" stroke-width="0.4"/><rect x="154" y="2" width="30" height="22" rx="1.2" fill="#fbe6c8" stroke="#333333" stroke-width="0.3"/><text x="156" y="7" font-size="3.4" font-weight="bold" fill="#333333">Tessellate</text><text x="156" y="12" font-size="2.9" fill="#333333" >ribbons and</text><text x="156" y="16.2" font-size="2.9" fill="#333333" >junctions</text><line x1="184.6" y1="13" x2="189.4" y2="13" stroke="#333333" stroke-width="0.4"/><polygon points="191.4,13 189.4,13.9 189.4,12.1" fill="#333333" stroke-width="0.4"/><rect x="192" y="2" width="30" height="22" rx="1.2" fill="#f7f5f0" stroke="#333333" stroke-width="0.3"/><text x="194" y="7" font-size="3.4" font-weight="bold" fill="#333333">Upload</text><text x="194" y="12" font-size="2.9" fill="#333333" >buffers and a</text><text x="194" y="16.2" font-size="2.9" fill="#333333" >style texture</text><line x1="222.6" y1="13" x2="227.4" y2="13" stroke="#333333" stroke-width="0.4"/><polygon points="229.4,13 227.4,13.9 227.4,12.1" fill="#333333" stroke-width="0.4"/><rect x="230" y="2" width="30" height="22" rx="1.2" fill="#f7f5f0" stroke="#333333" stroke-width="0.3"/><text x="232" y="7" font-size="3.4" font-weight="bold" fill="#333333">Draw</text><text x="232" y="12" font-size="2.9" fill="#333333" >casings, then</text><text x="232" y="16.2" font-size="2.9" fill="#333333" >fills, per group</text><text x="2" y="31" font-size="3" fill="#8a8a8a">Once per tile, on the CPU: everything up to Upload. Every frame, on the GPU: Draw.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 102" width="960" height="521" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="188" height="102" fill="#ffffff"/>
<rect x="2" y="2" width="84" height="34" rx="1.2" fill="#f7f5f0" stroke="#333333" stroke-width="0.3"/><text x="4" y="7" font-size="3.4" font-weight="bold" fill="#333333">BufferGeometry (per tile)</text><text x="4" y="12" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">position     a centreline point</text><text x="4" y="16.2" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">aExtrude     two offset vectors e1, e2</text><text x="4" y="20.4" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">aWidthLines  the lines l1, l2 they scale by</text><text x="4" y="24.6" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">aLine        the line giving the colour</text><text x="4" y="28.8" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">index        triangles, grouped by draw group</text><rect x="2" y="42" width="84" height="26" rx="1.2" fill="#f7f5f0" stroke="#333333" stroke-width="0.3"/><text x="4" y="47" font-size="3.4" font-weight="bold" fill="#333333">DataTexture, RGBA32F</text><text x="4" y="52" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">two texels per line:</text><text x="4" y="56.2" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">fill:   r, g, b, half width</text><text x="4" y="60.4" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">casing: r, g, b, half width + outline</text><rect x="2" y="74" width="84" height="26" rx="1.2" fill="#f7f5f0" stroke="#333333" stroke-width="0.3"/><text x="4" y="79" font-size="3.4" font-weight="bold" fill="#333333">Uniforms (per draw)</text><text x="4" y="84" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">uPass   0 casing, 1 fill</text><text x="4" y="88.2" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">uClip   the tile's footprint</text><text x="4" y="92.4" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">uCamera, uCasingDepthOffset</text><rect x="100" y="26" width="86" height="40" rx="1.2" fill="#fbe6c8" stroke="#333333" stroke-width="0.3"/><text x="102" y="31" font-size="3.4" font-weight="bold" fill="#333333">ShaderMaterial (GLSL 3)</text><text x="102" y="36" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">vertex shader:</text><text x="102" y="40.2" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">  w = texelFetch(style, line, pass).a</text><text x="102" y="44.4" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">  p = position + (e1·w(l1) + e2·w(l2)) × metre</text><text x="102" y="48.6" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">  casing depth: 1 m lower, along the ray</text><text x="102" y="52.8" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">fragment shader:</text><text x="102" y="57" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">  discard outside uClip</text><text x="102" y="61.2" font-size="2.7" fill="#333333" font-family="Menlo, Consolas, monospace" xml:space="preserve">  colour = texelFetch(style, aLine, pass).rgb</text><line x1="86" y1="19" x2="98.814" y2="36.39" stroke="#333333" stroke-width="0.4"/><polygon points="100,38 98.089,36.924 99.538,35.856" fill="#333333" stroke-width="0.4"/><line x1="86" y1="55" x2="98.211" y2="48.894" stroke="#333333" stroke-width="0.4"/><polygon points="100,48 98.614,49.699 97.809,48.089" fill="#333333" stroke-width="0.4"/><line x1="86" y1="87" x2="99.131" y2="59.801" stroke="#333333" stroke-width="0.4"/><polygon points="100,58 99.941,60.192 98.32,59.41" fill="#333333" stroke-width="0.4"/>
</svg>

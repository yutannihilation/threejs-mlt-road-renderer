catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# Do not resolve versions published less than 7 days ago (minutes).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # 0.2.5, published 2026-11-22; drop this once it is a week old.
  - "@maplibre/mlt-wasm"
  # The Vite+ toolchain the project was scaffolded with.
  - vite-plus
  - "@voidzero-dev/*"
  # Exact versions vite-plus 1.7.0 pins, published 2026-11-16, and tsrs 7.1.0-beta.tsrs4, published
  # 2026-11-20; drop these once they are a week old.
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - "@oxc-project/*"
  - tsrs
  - "@tsrs/*"
